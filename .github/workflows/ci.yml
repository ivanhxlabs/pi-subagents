name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Verify committed build is current
        run: git diff --exit-code -- dist

  # Build the matrix from npm on every run. This keeps the declared unbounded
  # >=0.85.0 range honest as new Pi versions are published.
  pi-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - id: versions
        shell: bash
        run: |
          versions=$(npm view @earendil-works/pi-coding-agent versions --json | node -e '
            let raw = "";
            process.stdin.on("data", chunk => { raw += chunk });
            process.stdin.on("end", () => {
              const supported = JSON.parse(raw).filter(version => {
                const [major, minor] = version.split(".").map(Number);
                return major > 0 || minor >= 85;
              });
              process.stdout.write(JSON.stringify([...supported, "latest"]));
            });
          ')
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  compat-pi:
    needs: pi-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pi-version: ${{ fromJSON(needs.pi-versions.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - name: Install Pi ${{ matrix.pi-version }}
        run: >-
          npm install --no-save
          @earendil-works/pi-agent-core@${{ matrix.pi-version }}
          @earendil-works/pi-ai@${{ matrix.pi-version }}
          @earendil-works/pi-coding-agent@${{ matrix.pi-version }}
          @earendil-works/pi-server@${{ matrix.pi-version }}
          @earendil-works/pi-tui@${{ matrix.pi-version }}
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npx vitest run --reporter=dot
      - name: Load compiled extension
        run: node -e "import('./dist/index.js')"

  # Scheduled advance warning for unpublished Pi drift. A failure here does not
  # redefine released-version support, but it must be reviewed before release.
  compat-pi-main:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          path: pi-subagents
      - uses: actions/checkout@v4
        with:
          repository: earendil-works/pi
          ref: main
          path: pi-main
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Build Pi main
        working-directory: pi-main
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Pack Pi main workspaces
        run: |
          mkdir artifacts
          for package in chord tui telemetry ai agent protocol client server coding-agent; do
            npm pack "./pi-main/packages/$package" --pack-destination ./artifacts
          done
      - name: Install Pi main artifacts
        working-directory: pi-subagents
        run: |
          npm ci
          npm install --no-save ../artifacts/*.tgz
      - name: Check strict compatibility seam
        working-directory: pi-subagents
        run: |
          npm run typecheck
          npx vitest run test/pi-compat.test.ts test/workflow-strict-runtime.test.ts test/e2e/workflow.e2e.test.ts --reporter=dot
